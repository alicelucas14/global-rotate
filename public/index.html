<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Menghubungkan…</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a, #0b1020);
      color: #e7ecf5;
    }
    .card {
      text-align: center; padding: 32px 28px; max-width: 420px; width: 92%;
      background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px; backdrop-filter: blur(6px);
    }
    .spinner {
      width: 46px; height: 46px; margin: 6px auto 18px;
      border: 4px solid rgba(255,255,255,.15); border-top-color: #5b9dff;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.15rem; margin: 0 0 6px; font-weight: 600; }
    p  { margin: 4px 0; font-size: .92rem; color: #a9b6ce; }
    .links { margin-top: 18px; display: none; }
    .links a {
      display: block; margin: 8px 0; padding: 11px 14px; border-radius: 12px;
      text-decoration: none; color: #dbe6ff; background: rgba(91,157,255,.14);
      border: 1px solid rgba(91,157,255,.35); font-weight: 600;
    }
    .small { font-size: .78rem; color: #6f7d97; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Menghubungkan ke server tercepat…</h1>
    <p id="subtitle">Mohon tunggu sebentar.</p>
    <div class="links" id="links">
      <p>Jika tidak dialihkan otomatis, pilih link di bawah:</p>
    </div>
    <div class="small">Anda akan dialihkan secara otomatis.</div>
  </div>

  <script>
  /*
   * Client-side smart gateway.
   *
   * Runs in the visitor's browser -> tests each candidate domain from the
   * user's REAL Indonesian ISP, and redirects to the first that responds.
   * This is the most accurate way to beat ISP-level (Kominfo/TrustPositif)
   * blocking, because the test happens from inside the same network that
   * would enforce the block.
   */
  (function () {
    // Candidate domains in priority order. Keep in sync with lib/domains.js.
    // You can also let the page pull the live list from /api/status.
    // Candidate domains in priority order. Keep in sync with lib/domains.js.
    // Add backup mirrors so the gateway can skip a blocked primary.
    var CANDIDATES = [
      'https://wings365fun.skin'
      // , 'https://your-mirror-1.skin'
      // , 'https://your-mirror-2.com'
    ];

    var TIMEOUT_MS = 3500;
    var LAST_GOOD_KEY = 'rotator_last_good';

    function norm(u) { return String(u || '').trim().replace(/\/+$/, ''); }

    // "Ping" a domain to decide if it is usable from THIS visitor's network.
    //   reachable  -> fetch resolves (server answered)            => true
    //   dead/DNS   -> fetch rejects immediately                   => false
    //   blocked    -> request hangs, we abort at TIMEOUT_MS       => false
    // no-cors lets us probe cross-origin without CORS headers.
    function reachable(url) {
      var target = norm(url) + '/favicon.ico?_r=' + Date.now();
      if (typeof fetch === 'function' && typeof AbortController === 'function') {
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS);
        return fetch(target, { mode: 'no-cors', cache: 'no-store', signal: ctrl.signal })
          .then(function () { clearTimeout(timer); return true; })
          .catch(function () { clearTimeout(timer); return false; });
      }
      // Fallback for very old browsers: image load with timeout.
      return new Promise(function (resolve) {
        var done = false;
        var img = new Image();
        var timer = setTimeout(function () { if (!done) { done = true; resolve(false); } }, TIMEOUT_MS);
        img.onload = function () { if (!done) { done = true; clearTimeout(timer); resolve(true); } };
        img.onerror = function () { if (!done) { done = true; clearTimeout(timer); resolve(false); } };
        img.src = target;
      });
    }

    function go(url) {
      try { localStorage.setItem(LAST_GOOD_KEY, url); } catch (e) {}
      window.location.replace(url);
    }

    function showManual(list) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Pilih link untuk melanjutkan';
      document.getElementById('subtitle').style.display = 'none';
      var box = document.getElementById('links');
      box.style.display = 'block';
      list.forEach(function (u) {
        var a = document.createElement('a');
        a.href = u; a.textContent = u.replace(/^https?:\/\//, '');
        a.rel = 'noopener';
        box.appendChild(a);
      });
    }

    async function pickAndGo(list) {
      // Try the remembered winner first for an instant redirect.
      var last = null;
      try { last = localStorage.getItem(LAST_GOOD_KEY); } catch (e) {}
      if (last && list.indexOf(last) !== -1) {
        if (await reachable(last)) return go(last);
      }
      // Otherwise walk the pool in priority order.
      for (var i = 0; i < list.length; i++) {
        // eslint-disable-next-line no-await-in-loop
        if (await reachable(list[i])) return go(list[i]);
      }
      // Nothing reachable automatically -> offer manual links.
      showManual(list);
    }

    // Prefer the server's live pool/order if available, else static list.
    fetch('/api/status', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (state) {
        var list = CANDIDATES.map(norm);
        if (state && Array.isArray(state.results) && state.results.length) {
          // Put ACTIVE ones first, keep server order.
          var active = state.results.filter(function (x) { return x.status === 'ACTIVE'; }).map(function (x) { return norm(x.url); });
          var rest = state.results.map(function (x) { return norm(x.url); }).filter(function (u) { return active.indexOf(u) === -1; });
          list = active.concat(rest);
        }
        pickAndGo(list);
      })
      .catch(function () { pickAndGo(CANDIDATES.map(norm)); });
  })();
  </script>
</body>
</html>
